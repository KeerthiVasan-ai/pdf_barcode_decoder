name: Branch Naming Convention

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  check-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Naming Convention
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            core.info(`Validating branch name: ${branchName}`);

            // Allowed branch prefixes and patterns
            // Examples: feat/pdf-decoding, fix/ios-crash, chore/update-deps, docs/readme, dependabot/*
            const branchRegex = /^(feat|feature|fix|bugfix|hotfix|chore|docs|refactor|perf|test|ci|release|dependabot|renovate)\/[a-zA-Z0-9._-]+$/;

            if (!branchRegex.test(branchName)) {
              core.setFailed(
                `❌ Invalid branch name: "${branchName}"\n\n` +
                `Branch names must follow the convention: <type>/<description>\n\n` +
                `Allowed types:\n` +
                `  - feat/ or feature/   : New features or enhancements\n` +
                `  - fix/ or bugfix/     : Bug fixes\n` +
                `  - hotfix/             : Critical urgent fixes\n` +
                `  - chore/              : Maintenance tasks or dependency updates\n` +
                `  - docs/               : Documentation changes\n` +
                `  - refactor/           : Code refactoring without functionality change\n` +
                `  - perf/               : Performance optimizations\n` +
                `  - test/               : Adding or modifying tests\n` +
                `  - ci/                 : Continuous integration configuration\n` +
                `  - release/            : Release preparation\n\n` +
                `Example valid branch names:\n` +
                `  - feat/qr-code-scanner\n` +
                `  - fix/ios-native-crash\n` +
                `  - docs/update-readme-examples\n` +
                `  - chore/bump-dependencies`
              );
            } else {
              core.info(`✅ Branch name "${branchName}" is valid.`);
            }
