name: pdf_barcode_decoder
description: A fast, lightweight Flutter plugin to decode barcodes (QR, PDF417, Aztec, DataMatrix, Code128, etc.) directly from PDF files and bytes.
version: 0.0.2
homepage: https://github.com/KeerthiVasan-ai/pdf_barcode_decoder
repository: https://github.com/KeerthiVasan-ai/pdf_barcode_decoder
issue_tracker: https://github.com/KeerthiVasan-ai/pdf_barcode_decoder/issues
topics:
  - pdf
  - barcode
  - qr-code
  - barcode-scanner
  - decoder

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pdfbarcode.pdf_barcode_decoder
        pluginClass: PdfBarcodeDecoderPlugin
      ios:
        pluginClass: PdfBarcodeDecoderPlugin
